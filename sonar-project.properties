# ===========================
# Project Information
# ===========================
sonar.projectKey=chunkhound
sonar.projectName=ChunkHound
sonar.projectVersion=1.0

# ===========================
# Source Code
# ===========================
sonar.sources=chunkhound
sonar.tests=tests

# ===========================
# Python
# ===========================
sonar.python.version=3.12

# ===========================
# Exclusions
# ===========================
sonar.exclusions=\
**/.venv/**,\
**/__pycache__/**,\
**/*.pyc,\
site/**,\
brand/**,\
dist/**,\
build/**

# ===========================
# Coverage
# ===========================
sonar.python.coverage.reportPaths=coverage.xml

# ===========================
# Encoding
# ===========================
sonar.sourceEncoding=UTF-8
